// Open the APK on your Android Device
//
// supports gradle version 9.x
// requires environment variable ANDROID_SDK_ROOT

androidComponents {
    onVariants(selector().all()) { variant ->
        def variantName = variant.name
        def appId = variant.applicationId.get()

        project.afterEvaluate {
            def installTaskName = "install${variantName.capitalize()}"
            def installTask = tasks.findByName(installTaskName)
            if (installTask != null) {

                tasks.register("open${variantName.capitalize()}", Exec) {
                    group = 'Open'
                    description = "Installs and opens the APK for ${variantName}."
                    dependsOn installTask

                    doFirst {
                        def mainActivity = project.ext.mainActivityClass
                        if (!mainActivity) {
                            throw new GradleException("Variable mainActivityClass not set in app/build.gradle")
                        } else if (mainActivity.startsWith('.')) {
                            throw new GradleException("Variable mainActivityClass must be an absolute path including the package name")
                        }

                        def sdkDir = System.env.ANDROID_SDK_ROOT ?: System.env.ANDROID_HOME
                        if (!sdkDir) {
                            throw new GradleException("Neither ANDROID_SDK_ROOT nor ANDROID_HOME environment variable is set")
                        }

                        def adb = "${sdkDir}/platform-tools/adb"
                        commandLine adb, 'shell', 'am', 'start', '-n',
                                "${appId}/${mainActivity}"
                    }
                }
            }
        }
    }
}
