plugins {
    id 'com.android.application'
}

// get signing properties
Properties keystoreProperties = new Properties()
if (project.rootProject.file('local.properties').exists()) {
    Properties localProperties = new Properties()
    localProperties.load(project.rootProject.file('local.properties').newDataInputStream())
    if (localProperties.getProperty('signingPropertiesFile') != null
            && new File(localProperties.getProperty('signingPropertiesFile')).exists()) {
        keystoreProperties.load(
                new FileInputStream(file(localProperties.getProperty('signingPropertiesFile'))))
    }
}
if (keystoreProperties.isEmpty()) {
    keystoreProperties.setProperty('storeFile', 'empty.keystore')
    keystoreProperties.setProperty('storePassword', 'storePassword')
    keystoreProperties.setProperty('keyAlias', 'keyAlias')
    keystoreProperties.setProperty('keyPassword', 'keyPassword')
}

android {
    compileSdkVersion 37
    namespace "de.eric_scheibler.tactileclock"

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 37
        resConfigs "en", "de", "es", "uk"
        multiDexEnabled true
        versionCode 17
        versionName '2.6.2'
        // project website
        buildConfigField 'String', 'CONTACT_EMAIL_ADDRESS', '"tactile-clock@eric-scheibler.de"'
        buildConfigField 'String', 'PROJECT_WEBSITE', '"https://github.com/scheibler/TactileClock"'
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        // Sets Java compatibility to Java 17
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
    }

    lintOptions {
        disable "InflateParams", "GoogleAppIndexingWarning"
        enable "NewerVersionAvailable"
        abortOnError true
    }
}

dependencies {
    // android x
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    // material design
    implementation 'com.google.android.material:material:1.14.0'

    // google helpers
    implementation 'com.google.guava:guava:33.6.0-android'
    implementation 'com.google.code.gson:gson:2.14.0'

    // logging
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // tasker integration (needs kotlin)
    implementation 'com.joaomgcd:taskerpluginlibrary:0.4.10'
}

// Open the APK on your Android Device
ext {
    mainActivityClass = 'de.eric_scheibler.tactileclock.ui.activity.MainActivity'
}
apply from: 'gradle-scripts/openApkTask.gradle'

// rename output files
//
// Common function for output file name creation
ext.buildOutputFileName = { variantName, versionName, extension ->
    def parts = [project.name]

    // Extract flavor and build type from variant name
    def buildType = ""
    def flavorName = ""
    android.buildTypes.names.each { bt ->
        if (variantName.toLowerCase().endsWith(bt.toLowerCase())) {
            buildType = bt
            flavorName = variantName.substring(0, variantName.length() - bt.length())
        }
    }

    if (!flavorName.isEmpty()) {
        parts.add(flavorName)
    }
    parts.add(versionName)
    parts.add(buildType)

    return "${parts.join('-')}.${extension}"
}

// Rename APKs
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def versionName = output.versionName.get()
            output.outputFileName.set(buildOutputFileName(variant.name, versionName, "apk"))
        }
    }
}

// Rename Bundles
afterEvaluate {
    tasks.matching { it.name.startsWith("bundle") }.configureEach { bundleTask ->
        bundleTask.doLast {
            def variantName = bundleTask.name.replace("bundle", "").uncapitalize()
            def versionName = android.defaultConfig.versionName
            def outputDir = file("${layout.buildDirectory.get()}/outputs/bundle/${variantName}")

            outputDir.listFiles()?.each { file ->
                if (file.name.endsWith(".aab")) {
                    def newName = buildOutputFileName(variantName, versionName, "aab")
                    file.renameTo(new File(outputDir, newName))
                }
            }
        }
    }
}

